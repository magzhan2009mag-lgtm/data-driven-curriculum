# Живая демо-ссылка на Render (бесплатный тариф): один контейнер из Dockerfile.
# Развернуть: https://render.com/deploy?repo=https://github.com/magzhan2009mag-lgtm/data-driven-curriculum
services:
  - type: web
    name: data-driven-curriculum
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/stats
